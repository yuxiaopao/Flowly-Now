{% extends "admin/login.html" %}
{% load static %}

{% block extrahead %}
<style>
:root {
    --flowly-primary: #6366f1;
    --flowly-primary-hover: #4f46e5;
    --flowly-gradient: linear-gradient(135deg, #6366f1 0%, #818cf8 100%);
}

body {
    background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #1e1b4b 100%) !important;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

.login-card {
    border-radius: 20px !important;
    overflow: hidden;
    border: none !important;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4) !important;
    max-width: 420px;
    width: 90%;
    margin: 0 auto;
}

.login-logo {
    text-align: center;
    padding: 30px 24px 10px;
    background: linear-gradient(135deg, rgba(99,102,241,0.08), rgba(129,140,248,0.04));
}

.login-logo h1 {
    font-size: 1.8rem;
    font-weight: 800;
    background: linear-gradient(135deg, #6366f1, #818cf8, #a5b4fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 12px 0 4px;
}

.login-logo p {
    color: rgba(255,255,255,0.6);
    font-size: 0.85rem;
}

.login-card-body {
    padding: 30px 24px !important;
    background: #fff;
}

.form-control {
    border: 1.5px solid #e2e8f0 !important;
    border-radius: 10px !important;
    padding: 10px 14px !important;
    font-size: 0.9rem !important;
    transition: all 0.2s !important;
}

.form-control:focus {
    border-color: var(--flowly-primary) !important;
    box-shadow: 0 0 0 3px rgba(99,102,241,0.12) !important;
}

label {
    font-weight: 600 !important;
    color: #374151 !important;
    font-size: 0.85rem !important;
    margin-bottom: 6px !important;
}

.btn-block {
    background: var(--flowly-gradient) !important;
    border: none !important;
    border-radius: 10px !important;
    padding: 12px !important;
    font-weight: 700 !important;
    font-size: 0.95rem !important;
    transition: all 0.25s !important;
    color: #fff !important;
    box-shadow: 0 4px 12px rgba(99,102,241,0.35) !important;
}

.btn-block:hover {
    transform: translateY(-2px) !important;
    box-shadow: 0 6px 20px rgba(99,102,241,0.5) !important;
    background: linear-gradient(135deg, #4f46e5, #6366f1) !important;
}

a {
    color: var(--flowly-primary) !important;
    font-weight: 600 !important;
    font-size: 0.85rem !important;
}

a:hover {
    color: var(--flowly-primary-hover) !important;
}

.errors {
    background: rgba(239,68,68,0.08) !important;
    border-left: 4px solid #ef4444 !important;
    border-radius: 8px !important;
    padding: 12px !important;
    font-size: 0.85rem !important;
    color: #dc2626 !important;
}

.errors li {
    color: #dc2626 !important;
}

.submit-row {
    padding: 16px 0 0 !important;
}

#header {
    display: none !important;
}
</style>
{% endblock %}
