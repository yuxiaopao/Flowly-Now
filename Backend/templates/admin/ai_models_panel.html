{% extends "admin/flowly_base.html" %}
{% load static %}

{% block flowly_content %}
<div class="f-panel">

    <div class="f-page-header">
        <div class="f-page-header-main">
            <h2><i class="fas fa-brain"></i> AI 模型配置</h2>
            <p>管理所有 AI 模型提供商的 API 密钥、端点和默认参数</p>
        </div>
        <div class="f-page-header-actions">
            <button class="f-btn f-btn-outline f-btn-sm" onclick="aiPanel.testAll()">
                <i class="fas fa-plug"></i> 测试所有连接
            </button>
        </div>
    </div>

    <div class="f-panel-body">

        <div class="f-card-title"><i class="fas fa-layer-group"></i> AI 提供商</div>
        <div id="providerCards"></div>

        <div class="f-card ai-params-card">
            <div class="f-card-title"><i class="fas fa-sliders-h"></i> 默认参数配置</div>
            <div class="ai-params-grid">

                <div class="ai-param-field">
                    <label class="ai-label" for="cfg-default-model">默认模型</label>
                    <input type="text" id="cfg-default-model" class="f-input" placeholder="qwen2.5-coder:7b" aria-label="默认模型">
                </div>

                <div class="ai-param-field">
                    <label class="ai-label" for="cfg-temperature">
                        Temperature <span id="tempDisplay">0.7</span>
                    </label>
                    <div class="ai-range-row">
                        <input type="range" id="cfg-temperature" min="0" max="2" step="0.05" value="0.7"
                               class="ai-range" aria-label="Temperature" oninput="document.getElementById('tempDisplay').textContent=this.value">
                    </div>
                </div>

                <div class="ai-param-field">
                    <label class="ai-label" for="cfg-max-tokens">Max Tokens</label>
                    <input type="number" id="cfg-max-tokens" class="f-input" placeholder="2048" value="2048" aria-label="最大 Token 数">
                </div>

                <div class="ai-param-field">
                    <label class="ai-label" for="cfg-timeout">超时时间（秒）</label>
                    <input type="number" id="cfg-timeout" class="f-input" placeholder="120" value="120" aria-label="超时时间">
                </div>

                <div class="ai-param-field">
                    <label class="ai-label" for="cfg-nl-model">NL 工作流模型</label>
                    <input type="text" id="cfg-nl-model" class="f-input" placeholder="qwen2.5-coder:7b" aria-label="自然语言转工作流模型">
                </div>

                <div class="ai-param-field">
                    <span class="ai-label">流式输出</span>
                    <div class="ai-toggle-row">
                        <label for="cfg-streaming" class="f-toggle" title="流式输出开关">
                            <input type="checkbox" id="cfg-streaming" aria-label="流式输出">
                            <span class="f-toggle-track"></span>
                        </label>
                        <span class="ai-toggle-desc">启用流式输出</span>
                    </div>
                </div>

            </div>
            <div class="ai-save-row">
                <button class="f-btn f-btn-primary" onclick="aiPanel.saveParams()">
                    <i class="fas fa-save"></i> 保存参数配置
                </button>
            </div>
        </div>

        <div class="f-card ai-compare-card">
            <div class="f-card-title"><i class="fas fa-balance-scale"></i> 模型对比</div>
            <div class="ai-table-wrap">
                <table class="f-table ai-table">
                    <thead>
                        <tr>
                            <th>模型</th>
                            <th>提供商</th>
                            <th>上下文</th>
                            <th>速度</th>
                            <th>成本</th>
                            <th>推荐场景</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody id="modelCompareBody">
                        <tr><td colspan="7" class="text-center text-muted">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<div id="providerModal" class="f-modal-overlay" aria-hidden="true" role="dialog" aria-labelledby="providerModalTitle">
    <div class="f-modal ai-modal">
        <div class="f-modal-header">
            <h3 id="providerModalTitle"></h3>
            <button class="f-modal-close" onclick="aiPanel.closeModal()" aria-label="关闭">&#x2715;</button>
        </div>
        <div id="providerModalBody"></div>
        <div class="ai-modal-actions">
            <button class="f-btn f-btn-ghost" onclick="aiPanel.testCurrentProvider()">
                <i class="fas fa-plug"></i> 测试连接
            </button>
            <div class="ai-modal-right">
                <button class="f-btn f-btn-ghost" onclick="aiPanel.closeModal()">取消</button>
                <button class="f-btn f-btn-primary" onclick="aiPanel.saveProvider()"><i class="fas fa-save"></i> 保存</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<style>
.ai-params-card { margin-top: 20px; }
.ai-params-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 12px; }
.ai-param-field { display: flex; flex-direction: column; gap: 6px; }
.ai-label { font-weight: 600; font-size: 0.8rem; color: var(--text-secondary); }
.ai-label span { color: var(--accent); font-weight: 700; }
.ai-range-row { display: flex; align-items: center; gap: 12px; }
.ai-range { flex: 1; accent-color: var(--accent); cursor: pointer; }
.ai-toggle-row { display: flex; align-items: center; gap: 12px; padding: 4px 0; }
.ai-toggle-desc { font-size: 0.8rem; color: var(--text-muted); }
.ai-save-row { margin-top: 20px; display: flex; justify-content: flex-end; }
.ai-compare-card { margin-top: 20px; }
.ai-table-wrap { overflow-x: auto; }
.ai-table { min-width: 700px; }
.ai-modal { width: 560px; }
.ai-modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; gap: 10px; }
.ai-modal-right { display: flex; gap: 10px; }
.ai-modal-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; }
.ai-modal-field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.ai-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 4px; }
.ai-config-ok, .ai-test-ok { color: var(--success); font-weight: 600; }
.ai-config-warn, .ai-test-fail { color: var(--danger); font-weight: 600; }
</style>
<script>
(function() {
    'use strict';

    var providerMeta = {
        openai: { icon: 'fab fa-openai', color: '#10a37f', bg: 'rgba(16,163,127,0.1)' },
        anthropic: { icon: 'fas fa-moon', color: '#d4a574', bg: 'rgba(212,165,116,0.1)' },
        ollama: { icon: 'fas fa-microchip', color: '#1d4ed8', bg: 'rgba(29,78,216,0.1)' },
        qwen: { icon: 'fas fa-cloud-sun', color: '#f59e0b', bg: 'rgba(245,158,11,0.1)' },
        zhipu: { icon: 'fas fa-robot', color: '#06b6d4', bg: 'rgba(6,182,212,0.1)' },
        wenxin: { icon: 'fas fa-palette', color: '#2937f0', bg: 'rgba(41,55,240,0.1)' },
        default: { icon: 'fas fa-brain', color: '#1d4ed8', bg: 'rgba(29,78,216,0.1)' },
    };

    var envProviders = {
        openai: {
            icon: 'fab fa-openai', color: '#10a37f', bg: 'rgba(16,163,127,0.1)',
            name: 'OpenAI', models: 'GPT-4o / GPT-3.5 Turbo',
            fields: [
                { id: 'api_key', label: 'API Key', type: 'password', placeholder: 'sk-...' },
                { id: 'base_url', label: 'Base URL', type: 'text', placeholder: 'https://api.openai.com/v1' },
            ]
        },
        anthropic: {
            icon: 'fas fa-moon', color: '#d4a574', bg: 'rgba(212,165,116,0.1)',
            name: 'Anthropic', models: 'Claude 3.5 Sonnet',
            fields: [{ id: 'api_key', label: 'API Key', type: 'password', placeholder: 'sk-ant-...' }]
        },
        ollama: {
            icon: 'fas fa-microchip', color: '#1d4ed8', bg: 'rgba(29,78,216,0.1)',
            name: 'Ollama (本地)', models: 'DeepSeek / Qwen / Llama',
            fields: [
                { id: 'base_url', label: '服务地址', type: 'text', placeholder: 'http://localhost:11434' },
                { id: 'default_model', label: '默认模型', type: 'text', placeholder: 'qwen2.5-coder:7b' },
            ]
        },
    };

    var currentProviderKey = null;
    var loadedData = null;

    function formatContext(n) {
        if (!n) return '—';
        if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
        if (n >= 1000) return Math.round(n / 1000) + 'K';
        return String(n);
    }

    function formatCost(input, output) {
        if (!input && !output) return '免费/本地';
        return '$' + input + ' / $' + output + ' per 1K';
    }

    function providerConfigured(slug, cfg) {
        if (!cfg) return null;
        if (slug === 'openai') return cfg.openai_configured;
        if (slug === 'anthropic') return cfg.anthropic_configured;
        if (slug === 'ollama') return !!cfg.ollama_base_url;
        return null;
    }

    var aiPanel = window.aiPanel = {
        load: async function() {
            showLoading();
            try {
                loadedData = await apiCall('/admin/flowly/ai-models-data/');
                this.renderProviders(loadedData.providers || []);
                this.renderModels(loadedData.models || []);
                this.applyEnvConfig(loadedData.env_config || {});
            } catch(e) {
                showToast('AI 模型数据加载失败', 'error');
            }
            hideLoading();
        },

        renderProviders: function(providers) {
            var container = document.getElementById('providerCards');
            var cfg = (loadedData && loadedData.env_config) || {};
            if (!providers.length) {
                container.innerHTML = '<div class="f-empty"><i class="fas fa-brain"></i><h4>暂无提供商</h4><p>请在 Gateway 模块中添加 ModelProvider</p></div>';
                return;
            }
            container.innerHTML = providers.map(function(p) {
                var meta = providerMeta[p.slug] || providerMeta.default;
                var statusClass = p.is_active ? 'active' : 'inactive';
                var configured = providerConfigured(p.slug, cfg);
                var configHint = configured === true
                    ? ' · <span class="ai-config-ok">密钥已配置</span>'
                    : (configured === false ? ' · <span class="ai-config-warn">密钥未配置</span>' : '');
                var testState = p._testState || '';
                var statusText = p.is_active
                    ? '<span class="ai-dot"></span> 已启用 · ' + p.model_count + ' 模型' + configHint + testState
                    : '已禁用' + configHint;
                return '<div class="f-model-card" id="card-' + p.slug + '">' +
                    '<div class="f-model-icon" style="background:' + meta.bg + ';color:' + meta.color + ';">' +
                    '<i class="' + meta.icon + '"></i></div>' +
                    '<div class="f-model-info">' +
                    '<div class="f-model-name">' + p.name + '</div>' +
                    '<div class="f-model-provider">' + (p.description || p.slug) + '</div>' +
                    '<div class="f-model-status ' + statusClass + '" id="status-' + p.slug + '">' + statusText + '</div></div>' +
                    '<a href="/admin/gateway/modelprovider/' + p.id + '/change/" class="f-btn f-btn-sm f-btn-outline" aria-label="编辑 ' + p.name + '">' +
                    '<i class="fas fa-cog"></i></a></div>';
            }).join('');
        },

        renderModels: function(models) {
            var tbody = document.getElementById('modelCompareBody');
            if (!models.length) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">暂无模型数据</td></tr>';
                return;
            }
            tbody.innerHTML = models.map(function(m) {
                var badge = m.is_default
                    ? '<span class="badge badge-update">默认</span>'
                    : (m.is_active ? '<span class="badge badge-reset">可用</span>' : '<span class="badge badge-danger">禁用</span>');
                var speed = m.supports_streaming ? '流式' : '标准';
                var cost = formatCost(m.input_price, m.output_price);
                return '<tr>' +
                    '<td><strong>' + m.name + '</strong><br><small class="text-muted">' + m.model_id + '</small></td>' +
                    '<td>' + m.provider + '</td>' +
                    '<td>' + formatContext(m.context_window) + '</td>' +
                    '<td>' + speed + '</td>' +
                    '<td>' + cost + '</td>' +
                    '<td>' + (m.description || m.model_type || '—') + '</td>' +
                    '<td>' + badge + '</td></tr>';
            }).join('');
        },

        applyEnvConfig: function(cfg) {
            var map = {
                'cfg-default-model': cfg.ollama_model,
                'cfg-nl-model': cfg.nl_workflow_model,
            };
            Object.keys(map).forEach(function(id) {
                var el = document.getElementById(id);
                if (el && map[id]) el.value = map[id];
            });
            var temp = document.getElementById('cfg-temperature');
            if (temp && cfg.nl_workflow_temperature != null) {
                temp.value = cfg.nl_workflow_temperature;
                document.getElementById('tempDisplay').textContent = cfg.nl_workflow_temperature;
            }
        },

        showEnvConfig: function(key) {
            currentProviderKey = key;
            var p = envProviders[key];
            if (!p) return;
            var cfg = (loadedData && loadedData.env_config) || {};
            var body = document.getElementById('providerModalBody');
            var html = '<p class="ai-modal-desc">配置 ' + p.name + ' 环境变量（写入 SystemSetting）：</p>';
            p.fields.forEach(function(f) {
                var placeholder = f.placeholder;
                if (f.type === 'password') {
                    if (key === 'openai' && cfg.openai_configured) placeholder = '••••••••（已配置，留空则不修改）';
                    if (key === 'anthropic' && cfg.anthropic_configured) placeholder = '••••••••（已配置，留空则不修改）';
                }
                html += '<div class="ai-modal-field">' +
                    '<label class="ai-label" for="pf_' + f.id + '">' + f.label + '</label>' +
                    '<input type="' + f.type + '" id="pf_' + f.id + '" class="f-input" ' +
                    'placeholder="' + placeholder + '" autocomplete="new-password"></div>';
            });
            body.innerHTML = html;
            if (key === 'ollama' && cfg.ollama_base_url) {
                var baseEl = document.getElementById('pf_base_url');
                if (baseEl) baseEl.value = cfg.ollama_base_url;
            }
            document.getElementById('providerModalTitle').innerHTML =
                '<i class="' + p.icon + '" style="color:' + p.color + '"></i> ' + p.name + ' 配置';
            var modal = document.getElementById('providerModal');
            modal.style.display = 'flex';
            modal.setAttribute('aria-hidden', 'false');
        },

        closeModal: function() {
            var modal = document.getElementById('providerModal');
            modal.style.display = 'none';
            modal.setAttribute('aria-hidden', 'true');
            currentProviderKey = null;
        },

        testCurrentProvider: async function() {
            if (!currentProviderKey) return;
            var p = envProviders[currentProviderKey];
            if (!p) return;
            var statusEl = document.getElementById('status-' + currentProviderKey);
            if (statusEl) statusEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 测试中...';
            showToast('正在测试 ' + p.name + ' 连接...', 'info');
            try {
                await apiCall('/admin/flowly/ai-models-data/');
                if (statusEl) statusEl.innerHTML = '<span class="ai-test-ok"><i class="fas fa-check-circle"></i> 连接正常</span>';
                showToast(p.name + ' 连接检测通过', 'success');
            } catch(e) {
                if (statusEl) statusEl.innerHTML = '<span class="ai-test-fail"><i class="fas fa-times-circle"></i> 连接失败</span>';
                showToast('连接测试失败', 'error');
            }
        },

        testAll: async function() {
            showLoading();
            try {
                var data = await apiCall('/admin/flowly/ai-models-data/');
                loadedData = data;
                var providers = (data.providers || []).map(function(p) {
                    var configured = providerConfigured(p.slug, data.env_config);
                    p._testState = configured
                        ? ' · <span class="ai-test-ok"><i class="fas fa-check-circle"></i> 已配置</span>'
                        : (configured === false ? ' · <span class="ai-test-fail"><i class="fas fa-exclamation-circle"></i> 待配置</span>' : '');
                    return p;
                });
                var active = providers.filter(function(p) { return p.is_active; });
                showToast('已检测 ' + active.length + ' 个活跃提供商，共 ' + (data.models || []).length + ' 个模型', 'success');
                this.renderProviders(providers);
                this.renderModels(data.models || []);
            } catch(e) {
                showToast('检测失败', 'error');
            }
            hideLoading();
        },

        saveProvider: async function() {
            if (!currentProviderKey) return;
            var p = envProviders[currentProviderKey];
            if (!p) return;
            var data = { provider: currentProviderKey };
            p.fields.forEach(function(f) {
                var el = document.getElementById('pf_' + f.id);
                if (el) data[f.id] = el.value;
            });
            try {
                await apiCall('/admin/flowly/api/update-config/', 'POST', {
                    key: 'ai.' + currentProviderKey + '.config',
                    value: data
                });
                showToast(p.name + ' 配置已保存', 'success');
                this.closeModal();
                this.load();
            } catch(e) {
                showToast('保存失败', 'error');
            }
        },

        saveParams: async function() {
            var updates = {};
            var ids = ['cfg-default-model', 'cfg-temperature', 'cfg-max-tokens', 'cfg-timeout', 'cfg-nl-model'];
            ids.forEach(function(id) {
                var el = document.getElementById(id);
                if (el) updates['ai.default.' + id.replace('cfg-', '')] = el.value || null;
            });
            var streaming = document.getElementById('cfg-streaming');
            if (streaming) updates['ai.default.streaming'] = streaming.checked;
            try {
                await apiCall('/admin/flowly/api/update-config/', 'POST', { updates: updates });
                showToast('AI 默认参数保存成功', 'success');
            } catch(e) {
                showToast('保存失败', 'error');
            }
        }
    };

    aiPanel.load();

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            var modal = document.getElementById('providerModal');
            if (modal && modal.style.display === 'flex') {
                aiPanel.closeModal();
            }
        }
    });
})();
</script>
{% endblock %}
