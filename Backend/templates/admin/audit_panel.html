{% extends "admin/flowly_base.html" %}
{% load static %}

{% block flowly_content %}
<div class="f-panel">

    <div class="f-panel-header ap-header">
        <div class="ap-header-row">
            <div>
                <h2><i class="fas fa-history"></i> 审计日志</h2>
                <p>记录所有配置变更、操作历史，可追溯每一次修改</p>
            </div>
            <div class="ap-header-actions">
                <button class="f-btn ap-btn" onclick="audit.export()">
                    <i class="fas fa-download"></i> 导出 CSV
                </button>
                <button class="f-btn ap-btn" onclick="audit.load()">
                    <i class="fas fa-sync-alt"></i> 刷新
                </button>
            </div>
        </div>
    </div>

    <div class="f-panel-body">

        <div class="ap-stats-grid" id="auditStats">
            <div class="f-stat primary">
                <div class="f-stat-value" id="totalActions">—</div>
                <div class="f-stat-label">总操作数</div>
            </div>
            <div class="f-stat success">
                <div class="f-stat-value" id="todayActions">—</div>
                <div class="f-stat-label">今日操作</div>
            </div>
            <div class="f-stat info">
                <div class="f-stat-value" id="topUser">—</div>
                <div class="f-stat-label">最活跃用户</div>
            </div>
            <div class="f-stat warning">
                <div class="f-stat-value" id="topFeature">—</div>
                <div class="f-stat-label">最常修改功能</div>
            </div>
        </div>

        <div class="ap-filters-row">
            <div class="f-search ap-search">
                <i class="fas fa-search"></i>
                <input type="text" id="auditSearch" class="f-input" placeholder="搜索功能名称，操作人..." oninput="audit.filter()" aria-label="搜索日志">
            </div>
            <select id="actionFilter" class="f-input f-select ap-select" onchange="audit.filter()" aria-label="筛选操作类型">
                <option value="">全部操作</option>
                <option value="update">修改</option>
                <option value="toggle">切换</option>
                <option value="reset">重置</option>
                <option value="create">创建</option>
                <option value="delete">删除</option>
            </select>
            <input type="date" id="dateFrom" class="f-input ap-date" onchange="audit.filter()" aria-label="开始日期">
            <span class="ap-range-sep">至</span>
            <input type="date" id="dateTo" class="f-input ap-date" onchange="audit.filter()" aria-label="结束日期">
            <button class="f-btn f-btn-sm f-btn-ghost" onclick="audit.clearFilters()" title="清除筛选" aria-label="清除筛选">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="ap-charts-grid">
            <div class="f-card">
                <div class="f-card-title"><i class="fas fa-chart-pie"></i> 操作类型分布</div>
                <div class="ap-chart-wrap">
                    <canvas id="actionPieChart" aria-label="操作类型分布图表"></canvas>
                </div>
            </div>
            <div class="f-card">
                <div class="f-card-title"><i class="fas fa-fire"></i> 热度排行</div>
                <div id="topFeaturesList" class="ap-rank-list"></div>
            </div>
        </div>

        <div class="f-table-wrap">
            <table class="f-table" aria-label="审计日志表格">
                <thead>
                    <tr>
                        <th class="ap-th-num">#</th>
                        <th>功能</th>
                        <th class="ap-th-action">操作</th>
                        <th>旧值</th>
                        <th>新值</th>
                        <th>操作人</th>
                        <th>IP地址</th>
                        <th>原因</th>
                        <th class="ap-th-time">时间</th>
                    </tr>
                </thead>
                <tbody id="auditTableBody" aria-live="polite" aria-label="日志数据">
                </tbody>
            </table>
        </div>

        <div id="auditPagination" class="f-pagination" aria-label="分页导航"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<style>
.ap-header { background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #fcd34d 100%); }
.ap-header-row { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
.ap-header-actions { display: flex; gap: 10px; align-items: center; }
.ap-btn { background: rgba(255,255,255,0.15); color: #fff; border: 1.5px solid rgba(255,255,255,0.3); }
.ap-stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.ap-filters-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
.ap-search { flex: 1; min-width: 200px; }
.ap-select { width: 130px; }
.ap-date { width: 140px; }
.ap-range-sep { color: var(--text-muted); font-size: 0.8rem; white-space: nowrap; }
.ap-charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.ap-chart-wrap { height: 180px; position: relative; }
.ap-rank-list { max-height: 200px; overflow-y: auto; }
.ap-empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.ap-empty i { font-size: 2rem; opacity: 0.3; display: block; margin-bottom: 12px; }
.ap-td-center { text-align: center; padding: 60px 20px; }
.ap-loading i { font-size: 1.5rem; color: var(--accent); }
.ap-td-muted { color: var(--text-muted); font-size: 0.8rem; }
.ap-td-error { color: var(--danger); }
.ap-td-truncate { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ap-code { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-muted); }
.ap-val-new { color: var(--success) !important; }
.ap-rank-item { padding: 8px 0; border-bottom: 1px solid var(--border); }
.ap-rank-item:last-child { border-bottom: none; }
.ap-rank-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.ap-rank-key { font-size: 0.78rem; font-family: 'JetBrains Mono', monospace; color: var(--text-primary); font-weight: 600; }
.ap-rank-count { font-size: 0.8rem; font-weight: 700; color: var(--accent); }
.ap-th-num { width: 40px; }
.ap-th-action { width: 80px; }
.ap-th-time { width: 160px; }
@media (max-width: 768px) {
    .ap-stats-grid { grid-template-columns: 1fr 1fr; }
    .ap-charts-grid { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
    .ap-stats-grid { grid-template-columns: 1fr; }
}
</style>
<script>
(function() {
    'use strict';

    var audit = window.audit = {
        data: [],
        filtered: [],
        page: 1,
        pageSize: 20,
        pieChart: null,

        load: async function() {
            var tbody = document.getElementById('auditTableBody');
            tbody.innerHTML = '<tr><td colspan="9" class="ap-td-center ap-loading"><i class="fas fa-spinner fa-spin"></i></td></tr>';
            try {
                var data = await apiCall('/api/v1/features/audit/?limit=200');
                this.data = data || [];
                this.filter();
                this.renderStats();
                this.renderPie();
                this.renderTopFeatures();
            } catch(e) {
                tbody.innerHTML = '<tr><td colspan="9" class="ap-td-center ap-td-error">加载失败</td></tr>';
            }
        },

        filter: function() {
            var search = (document.getElementById('auditSearch').value || '').toLowerCase();
            var action = document.getElementById('actionFilter').value;
            var dateFrom = document.getElementById('dateFrom').value;
            var dateTo = document.getElementById('dateTo').value;

            this.filtered = this.data.filter(function(log) {
                if (action && log.action !== action) return false;
                if (dateFrom && (!log.created_at || log.created_at < dateFrom)) return false;
                if (dateTo && (!log.created_at || log.created_at > dateTo + 'T23:59:59')) return false;
                if (search) {
                    var s = (log.feature_name || '') + (log.feature_key || '') +
                            (log.changed_by_username || '') + (log.reason || '');
                    if (!s.toLowerCase().includes(search)) return false;
                }
                return true;
            });

            this.page = 1;
            this.render();
        },

        clearFilters: function() {
            document.getElementById('auditSearch').value = '';
            document.getElementById('actionFilter').value = '';
            document.getElementById('dateFrom').value = '';
            document.getElementById('dateTo').value = '';
            this.filter();
        },

        renderStats: function() {
            document.getElementById('totalActions').textContent = this.data.length;
            var today = new Date().toDateString();
            var todayCount = this.data.filter(function(d) {
                return d.created_at && new Date(d.created_at).toDateString() === today;
            }).length;
            animateCounter(document.getElementById('todayActions'), todayCount, 800);

            var userCounts = {};
            this.data.forEach(function(d) {
                var u = d.changed_by_username || '未知';
                userCounts[u] = (userCounts[u] || 0) + 1;
            });
            var topU = Object.keys(userCounts).sort(function(a, b) { return userCounts[b] - userCounts[a]; })[0] || '—';
            document.getElementById('topUser').textContent = topU;

            var featCounts = {};
            this.data.forEach(function(d) {
                var f = d.feature_key || d.feature_name || '未知';
                featCounts[f] = (featCounts[f] || 0) + 1;
            });
            var topF = Object.keys(featCounts).sort(function(a, b) { return featCounts[b] - featCounts[a]; })[0] || '—';
            document.getElementById('topFeature').textContent = topF;
        },

        renderPie: function() {
            if (this.pieChart) this.pieChart.destroy();
            var counts = {};
            this.data.forEach(function(d) {
                var a = d.action || 'other';
                counts[a] = (counts[a] || 0) + 1;
            });
            var colors = { update: '#6366f1', toggle: '#f59e0b', reset: '#06b6d4', create: '#10b981', delete: '#ef4444', other: '#94a3b8' };
            var labels = { update: '修改', toggle: '切换', reset: '重置', create: '创建', delete: '删除', other: '其他' };

            this.pieChart = createDoughnutChart('actionPieChart', {
                labels: Object.keys(counts).map(function(k) { return labels[k] || k; }),
                datasets: [{
                    data: Object.values(counts),
                    backgroundColor: Object.keys(counts).map(function(k) { return colors[k] || '#94a3b8'; }),
                    borderWidth: 0, hoverOffset: 8,
                }]
            });
        },

        renderTopFeatures: function() {
            var counts = {};
            this.data.forEach(function(d) {
                var f = d.feature_key || d.feature_name || '未知';
                counts[f] = (counts[f] || 0) + 1;
            });
            var sorted = Object.keys(counts).sort(function(a, b) { return counts[b] - counts[a]; }).slice(0, 5);
            var container = document.getElementById('topFeaturesList');
            if (sorted.length === 0) {
                container.innerHTML = '<div class="ap-empty"><i class="fas fa-inbox"></i>暂无数据</div>';
                return;
            }
            var max = counts[sorted[0]];
            container.innerHTML = sorted.map(function(key) {
                var pct = Math.round(counts[key] / max * 100);
                return '<div class="ap-rank-item">' +
                    '<div class="ap-rank-header">' +
                    '<code class="ap-rank-key">' + escHtml(key) + '</code>' +
                    '<span class="ap-rank-count">' + counts[key] + ' 次</span></div>' +
                    '<div class="f-progress"><div class="f-progress-bar" style="width:' + pct + '%;background:var(--accent);"></div></div></div>';
            }).join('');
        },

        render: function() {
            var tbody = document.getElementById('auditTableBody');
            var totalPages = Math.ceil(this.filtered.length / this.pageSize);
            var start = (this.page - 1) * this.pageSize;
            var page = this.filtered.slice(start, start + this.pageSize);

            if (page.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="ap-td-center ap-td-muted"><i class="fas fa-inbox" style="font-size:2rem;opacity:0.3;display:block;margin-bottom:12px;"></i>暂无日志记录</td></tr>';
                document.getElementById('auditPagination').innerHTML = '';
                return;
            }

            var badges = { update: 'badge-update', toggle: 'badge-toggle', reset: 'badge-reset', create: 'badge-create', delete: 'badge-delete' };
            var labels = { update: '修改', toggle: '切换', reset: '重置', create: '创建', delete: '删除' };

            tbody.innerHTML = page.map(function(log, i) {
                var badge = badges[log.action] || 'badge-update';
                var label = labels[log.action] || log.action || '';
                return '<tr>' +
                    '<td class="ap-td-muted">' + (start + i + 1) + '</td>' +
                    '<td><strong>' + escHtml(log.feature_name || '—') + '</strong><br><code class="ap-code">' + escHtml(log.feature_key || '') + '</code></td>' +
                    '<td><span class="badge ' + badge + '">' + label + '</span></td>' +
                    '<td><code class="ap-code">' + escHtml(fmtV(log.old_value)) + '</code></td>' +
                    '<td><code class="ap-code ap-val-new">' + escHtml(fmtV(log.new_value)) + '</code></td>' +
                    '<td>' + escHtml(log.changed_by_username || '—') + '</td>' +
                    '<td><code class="ap-code">' + escHtml(log.ip_address || '—') + '</code></td>' +
                    '<td class="ap-td-truncate" title="' + escHtml(log.reason || '') + '">' + escHtml(log.reason || '—') + '</td>' +
                    '<td class="ap-td-muted">' + (log.created_at ? new Date(log.created_at).toLocaleString('zh-CN') : '—') + '</td>' +
                    '</tr>';
            }).join('');

            renderPagination('auditPagination', this.filtered.length, this.page, this.pageSize, 'audit.goPage');
        },

        goPage: function(p) {
            this.page = p;
            this.render();
        },

        export: function() {
            var rows = this.filtered.length > 0 ? this.filtered : this.data;
            var csv = '序号,功能名称,功能标识,操作,旧值,新值,操作人,IP,原因,时间\\n';
            rows.forEach(function(log, i) {
                csv += [i+1, log.feature_name||'', log.feature_key||'', log.action||'',
                    fmtV(log.old_value)||'', fmtV(log.new_value)||'',
                    log.changed_by_username||'', log.ip_address||'',
                    log.reason||'', log.created_at||''
                ].map(function(s) { return '"' + String(s).replace(/"/g, '""') + '"'; }).join(',') + '\\n';
            });
            var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'audit_log_' + new Date().toISOString().slice(0,10) + '.csv';
            a.click();
            showToast('📥 审计日志已导出', 'success');
        }
    };

    function escHtml(s) {
        if (s === null || s === undefined) return '';
        var div = document.createElement('div');
        div.textContent = String(s);
        return div.innerHTML;
    }

    function fmtV(v) {
        if (v === null || v === undefined) return '';
        if (typeof v === 'object') return JSON.stringify(v);
        return String(v);
    }

    audit.load();
})();
</script>
{% endblock %}
