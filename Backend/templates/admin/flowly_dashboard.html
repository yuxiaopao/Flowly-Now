{% extends "admin/flowly_base.html" %}
{% load static %}

{% block flowly_content %}
<div class="f-panel">

    <div class="f-page-header">
        <div class="f-page-header-main">
            <h2><i class="fas fa-chart-line"></i> 管理控制台</h2>
            <p id="liveClock" class="f-page-meta">加载中...</p>
            <span id="autoRefreshBadge" class="fd-auto-badge" hidden aria-live="polite">
                <span class="fd-pulse-dot" aria-hidden="true"></span> 自动刷新中
            </span>
        </div>
        <div class="f-page-header-actions">
            <select id="periodSelect" class="f-input f-select" onchange="dashboard.load()" aria-label="选择时间范围">
                <option value="24h">过去 24 小时</option>
                <option value="7d" selected>过去 7 天</option>
                <option value="30d">过去 30 天</option>
            </select>
            <button class="f-btn f-btn-ghost f-btn-sm" onclick="dashboard.load()">
                <i class="fas fa-sync-alt"></i> 刷新
            </button>
            <label class="f-toggle" title="自动刷新（30秒）">
                <input type="checkbox" id="autoRefresh" onchange="dashboard.toggleAuto()" aria-label="自动刷新">
                <span class="f-toggle-track"></span>
            </label>
            <a href="/admin/workflows/workflow/add/" class="f-btn f-btn-primary f-btn-sm">
                <i class="fas fa-plus"></i> 新建工作流
            </a>
        </div>
    </div>

    <div class="f-panel-body fd-body">
        <div class="f-card-title"><i class="fas fa-chart-bar"></i> 数据概览</div>
        <div id="statsGrid" class="f-grid f-grid-4"></div>
    </div>

    <div class="fd-charts-row">
        <div class="f-card">
            <div class="f-card-title">
                <i class="fas fa-chart-area"></i> 执行趋势
                <span id="trendPeriodLabel" class="fd-chart-subtitle"></span>
            </div>
            <div class="fd-chart-wrap" id="trendChartWrap">
                <canvas id="trendChart"></canvas>
            </div>
            <div class="fd-legend-row">
                <span class="fd-legend-item fd-legend-blue">总执行</span>
                <span class="fd-legend-item fd-legend-green">成功</span>
                <span class="fd-legend-item fd-legend-red">失败</span>
            </div>
        </div>

        <div class="f-card">
            <div class="f-card-title"><i class="fas fa-pie-chart"></i> 工作流状态</div>
            <div class="fd-chart-wrap fd-chart-sm" id="statusChartWrap">
                <canvas id="statusChart"></canvas>
            </div>
            <div id="statusLegend" class="fd-legend-col"></div>
        </div>
    </div>

    <div class="f-card fd-activity-card">
        <div class="f-card-title">
            <i class="fas fa-bolt"></i> 最近活动
            <span class="fd-activity-subtitle">实时更新</span>
        </div>
        <div id="activityFeed" class="fd-activity-feed"></div>
    </div>

</div>
{% endblock %}

{% block extra_js %}
<style>
.fd-body { margin-bottom: 20px; }
.fd-charts-row { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }
.fd-chart-wrap { height: 280px; position: relative; }
.fd-chart-sm { height: 200px; }
.fd-chart-subtitle { margin-left: auto; font-size: 0.7rem; font-weight: 400; text-transform: none; letter-spacing: 0; }
.fd-legend-row { display: flex; gap: 20px; margin-top: 14px; font-size: 0.8rem; color: var(--text-muted); }
.fd-legend-item { display: flex; align-items: center; gap: 6px; }
.fd-legend-item::before { content: ''; display: inline-block; width: 12px; height: 12px; border-radius: 2px; }
.fd-legend-blue::before { background: #1d4ed8; }
.fd-legend-green::before { background: #10b981; }
.fd-legend-red::before { background: #ef4444; }
.fd-legend-col { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
.fd-activity-card { margin-bottom: 0; }
.fd-activity-subtitle { margin-left: auto; font-size: 0.7rem; font-weight: 400; color: var(--text-muted); text-transform: none; letter-spacing: 0; }
.fd-activity-feed { max-height: 320px; overflow-y: auto; }
.fd-auto-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.72rem; font-weight: 600; color: var(--success); margin-left: 10px; vertical-align: middle; }
.fd-pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); animation: fd-pulse 1.5s ease-in-out infinite; }
@keyframes fd-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.85); } }
.fd-chart-empty { padding: 40px 16px !important; position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg-card); border-radius: var(--radius-sm); }
.fd-chart-wrap { position: relative; }
@media (prefers-reduced-motion: reduce) { .fd-pulse-dot { animation: none; } }
@media (max-width: 768px) {
    .fd-charts-row { grid-template-columns: 1fr; }
}
</style>
<script>
(function() {
    'use strict';

    updateClock('liveClock');

    var dashboard = window.dashboard = {
        autoTimer: null,
        trendChart: null,
        statusChart: null,

        errHtml: function() {
            return '<div class="f-empty"><i class="fas fa-exclamation-triangle"></i><h4>加载失败</h4>' +
                '<p>无法获取控制台数据，请检查网络或稍后重试</p>' +
                '<button type="button" class="f-btn f-btn-primary f-btn-sm" style="margin-top:12px" onclick="dashboard.load()">' +
                '<i class="fas fa-redo"></i> 重试</button></div>';
        },

        chartEmptyHtml: function(msg) {
            return '<div class="f-empty fd-chart-empty"><i class="fas fa-chart-line"></i><h4>' + msg + '</h4></div>';
        },

        setChartEmpty: function(wrapId, canvasId, msg) {
            var wrap = document.getElementById(wrapId);
            var canvas = document.getElementById(canvasId);
            if (!wrap || !canvas) return;
            wrap.querySelectorAll('.fd-chart-empty').forEach(function(el) { el.remove(); });
            canvas.style.display = 'none';
            wrap.insertAdjacentHTML('beforeend', this.chartEmptyHtml(msg));
        },

        clearChartEmpty: function(wrapId, canvasId) {
            var wrap = document.getElementById(wrapId);
            var canvas = document.getElementById(canvasId);
            if (!wrap || !canvas) return;
            wrap.querySelectorAll('.fd-chart-empty').forEach(function(el) { el.remove(); });
            canvas.style.display = 'block';
        },

        setAutoBadge: function(on) {
            var badge = document.getElementById('autoRefreshBadge');
            if (badge) badge.hidden = !on;
        },

        load: async function() {
            var period = document.getElementById('periodSelect').value;
            var grid = document.getElementById('statsGrid');
            renderSkeleton(grid, 8, 'stat');
            showLoading();
            try {
                var data = await apiCall('/admin/flowly/dashboard-data/?period=' + period);
                this.renderStats(data.summary || {});
                this.renderTrend(data.execution_trend || [], period);
                this.renderStatus(data.execution_status || {});
                this.renderActivity(data.recent_activity || []);
                document.getElementById('trendPeriodLabel').textContent =
                    { '24h': '24小时内', '7d': '7天内', '30d': '30天内' }[period] || '';
            } catch(e) {
                showToast('数据加载失败', 'error');
                grid.innerHTML = this.errHtml();
                document.getElementById('activityFeed').innerHTML = this.errHtml();
                if (this.trendChart) { this.trendChart.destroy(); this.trendChart = null; }
                if (this.statusChart) { this.statusChart.destroy(); this.statusChart = null; }
                this.setChartEmpty('trendChartWrap', 'trendChart', '无法加载图表');
                this.setChartEmpty('statusChartWrap', 'statusChart', '无法加载图表');
            }
            hideLoading();
        },

        renderStats: function(summary) {
            var grid = document.getElementById('statsGrid');
            var items = [
                { label: '总工作流', value: summary.workflows_total || 0, icon: 'fa-project-diagram', color: '#1d4ed8' },
                { label: '执行次数', value: summary.executions_total || 0, icon: 'fa-play', color: '#0284c7' },
                { label: '成功率', value: (summary.success_rate || 0) + '%', icon: 'fa-check-circle', color: '#10b981' },
                { label: '平均耗时', value: ((summary.avg_duration_ms || 0) / 1000).toFixed(2) + 's', icon: 'fa-clock', color: '#f59e0b' },
                { label: '活跃用户', value: summary.users_total || 0, icon: 'fa-users', color: '#0f2847' },
                { label: '活跃 Agent', value: summary.agents_total || 0, icon: 'fa-robot', color: '#2563eb' },
                { label: '租户数', value: summary.tenants_total || 0, icon: 'fa-building', color: '#1e3a5f' },
                { label: '节点总数', value: summary.nodes_total || 0, icon: 'fa-sitemap', color: '#64748b' },
            ];
            grid.innerHTML = items.map(function(s) {
                return '<div class="f-card fd-stat-card">' +
                    '<div class="fd-stat-icon" style="color:' + s.color + ';"><i class="fas ' + s.icon + '"></i></div>' +
                    '<div class="fd-stat-value">' + s.value + '</div>' +
                    '<div class="fd-stat-label">' + s.label + '</div></div>';
            }).join('');
        },

        renderTrend: function(trend, period) {
            var ctx = document.getElementById('trendChart');
            if (!ctx) return;
            if (this.trendChart) this.trendChart.destroy();

            var hasData = trend && trend.length && trend.some(function(i) { return (i.count || 0) > 0; });
            if (!hasData) {
                this.trendChart = null;
                this.setChartEmpty('trendChartWrap', 'trendChart', '暂无执行记录');
                return;
            }
            this.clearChartEmpty('trendChartWrap', 'trendChart');

            var labels = trend.map(function(item) {
                var d = item.date ? new Date(item.date) : null;
                if (!d) return '';
                if (period === '24h') return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                return (d.getMonth() + 1) + '/' + d.getDate();
            });

            this.trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: '总执行', data: trend.map(function(i) { return i.count; }), borderColor: '#1d4ed8', backgroundColor: 'rgba(29,78,216,0.1)', fill: true, tension: 0.4, pointRadius: 3 },
                        { label: '成功', data: trend.map(function(i) { return i.success; }), borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.1)', fill: true, tension: 0.4, pointRadius: 3 },
                        { label: '失败', data: trend.map(function(i) { return i.failed; }), borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,0.1)', fill: true, tension: 0.4, pointRadius: 3 }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: 'rgba(148,163,184,0.08)' }, ticks: { color: '#94a3b8', font: { size: 11 }, maxRotation: 0 } },
                        y: { beginAtZero: true, grid: { color: 'rgba(148,163,184,0.08)' }, ticks: { color: '#94a3b8', font: { size: 11 }, precision: 0 } }
                    },
                    interaction: { intersect: false, mode: 'index' }
                }
            });
        },

        renderStatus: function(data) {
            var ctx = document.getElementById('statusChart');
            if (!ctx) return;
            if (this.statusChart) this.statusChart.destroy();

            var items = [
                { label: '已完成', value: data.completed || 0, color: '#10b981' },
                { label: '运行中', value: data.running || 0, color: '#06b6d4' },
                { label: '已失败', value: data.failed || 0, color: '#ef4444' },
                { label: '待执行', value: data.pending || 0, color: '#f59e0b' },
            ];
            var total = items.reduce(function(s, i) { return s + i.value; }, 0);
            if (!total) {
                this.statusChart = null;
                document.getElementById('statusLegend').innerHTML = '';
                this.setChartEmpty('statusChartWrap', 'statusChart', '暂无工作流状态');
                return;
            }
            this.clearChartEmpty('statusChartWrap', 'statusChart');
            this.statusChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: items.map(function(i) { return i.label; }),
                    datasets: [{ data: items.map(function(i) { return i.value; }), backgroundColor: items.map(function(i) { return i.color; }), borderWidth: 0 }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, cutout: '65%',
                    plugins: { legend: { display: false } }
                }
            });
            document.getElementById('statusLegend').innerHTML = items.map(function(i) {
                return '<div class="fd-legend-row">' +
                    '<span class="fd-dot" style="background:' + i.color + ';"></span>' +
                    '<span style="font-size:0.82rem;color:var(--text-secondary);">' + i.label + '</span>' +
                    '<span style="margin-left:auto;font-weight:700;font-size:0.85rem;color:var(--text-primary);">' + i.value + '</span></div>';
            }).join('');
        },

        renderActivity: function(items) {
            var feed = document.getElementById('activityFeed');
            if (!items.length) {
                feed.innerHTML = '<div class="f-empty"><i class="fas fa-inbox"></i><h4>暂无活动</h4><p>执行工作流后将在此显示</p></div>';
                return;
            }
            feed.innerHTML = items.map(function(a) {
                var statusColor = { 'completed': 'var(--success)', 'failed': 'var(--danger)', 'running': 'var(--info)', 'pending': 'var(--warning)', 'queued': 'var(--warning)' }[a.status] || 'var(--text-muted)';
                var iconMap = { 'completed': 'fa-check-circle', 'failed': 'fa-times-circle', 'running': 'fa-spinner fa-spin', 'pending': 'fa-clock', 'queued': 'fa-clock' };
                var icon = iconMap[a.status] || 'fa-circle';
                var time = a.created_at ? new Date(a.created_at).toLocaleString('zh-CN') : '';
                return '<div class="fd-activity-item">' +
                    '<i class="fas ' + icon + '" style="color:' + statusColor + ';font-size:0.9rem;width:20px;text-align:center;flex-shrink:0;"></i>' +
                    '<div class="fd-activity-body">' +
                    '<div class="fd-activity-name">' + (a.workflow_name || '未知工作流') + '</div>' +
                    '<div class="fd-activity-meta">' + (a.trigger_type || '手动') + (a.triggered_by ? ' · ' + a.triggered_by : '') + '</div></div>' +
                    '<div class="fd-activity-right">' +
                    '<span class="fd-activity-status" style="color:' + statusColor + ';">' + a.status + '</span>' +
                    '<span class="fd-activity-time">' + time + '</span></div></div>';
            }).join('');
        },

        toggleAuto: function() {
            var checked = document.getElementById('autoRefresh').checked;
            if (this.autoTimer) { clearInterval(this.autoTimer); this.autoTimer = null; }
            this.setAutoBadge(checked);
            if (checked) {
                var self = this;
                this.autoTimer = setInterval(function() { self.load(); }, 30000);
                showToast('已开启 30 秒自动刷新', 'info');
            }
        }
    };

    dashboard.load();
})();
</script>
<style>
.fd-stat-card { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 24px 16px; gap: 8px; }
.fd-stat-icon { font-size: 1.8rem; margin-bottom: 4px; }
.fd-stat-value { font-size: 1.8rem; font-weight: 800; color: var(--text-primary); }
.fd-stat-label { font-size: 0.82rem; color: var(--text-muted); font-weight: 500; }
.fd-activity-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); transition: background 0.15s ease; }
.fd-activity-item:last-child { border-bottom: none; }
.fd-activity-item:hover { background: var(--bg-glass); }
.fd-activity-body { flex: 1; min-width: 0; }
.fd-activity-name { font-size: 0.88rem; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fd-activity-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
.fd-activity-right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; }
.fd-activity-status { font-size: 0.78rem; font-weight: 600; }
.fd-activity-time { font-size: 0.72rem; color: var(--text-muted); white-space: nowrap; }
.fd-empty { text-align: center; padding: 48px 20px; color: var(--text-muted); }
.fd-empty i { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.3; display: block; }
.fd-empty h4 { font-size: 0.95rem; color: var(--text-secondary); margin: 0; }
.fd-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
</style>
{% endblock %}
