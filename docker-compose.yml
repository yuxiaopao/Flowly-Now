version: '3.8'

services:
  # PostgreSQL with pgvector (for vector storage)
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: flowly-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-flowly}
      # ⚠️ 生产环境必须在 .env 中设置强密码
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD must be set in .env}
      POSTGRES_DB: ${PG_NAME:-flowly_vector}
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    networks:
      - flowly-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-flowly}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MySQL Database (main database)
  db:
    image: mysql:8.0
    container_name: flowly-ai-db-1
    restart: unless-stopped
    environment:
      # ⚠️ 生产环境必须在 .env 中设置强密码
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      MYSQL_DATABASE: ${DB_NAME:-flowly_db}
      MYSQL_USER: ${DB_USER:-flowly}
      # ⚠️ 生产环境必须在 .env 中设置强密码
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - flowly-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: flowly-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - flowly-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: flowly-backend
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-False}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-secret-for-local-dev-only}
      - DB_NAME=${DB_NAME:-flowly}
      - DB_USER=${DB_USER:-flowly}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - DB_HOST=db
      - DB_PORT=3306
      - PG_NAME=${PG_NAME:-flowly_vector}
      - PG_USER=${PG_USER:-flowly}
      - PG_PASSWORD=${PG_PASSWORD:-flowly_vector_pass}
      - PG_HOST=pgvector
      - PG_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flowly-network
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"

  # Celery Worker
  celery:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: flowly-celery
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-False}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-secret-for-local-dev-only}
      - DB_NAME=${DB_NAME:-flowly}
      - DB_USER=${DB_USER:-flowly}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - DB_HOST=db
      - DB_PORT=3306
      - PG_NAME=${PG_NAME:-flowly_vector}
      - PG_USER=${PG_USER:-flowly}
      - PG_PASSWORD=${PG_PASSWORD:-flowly_vector_pass}
      - PG_HOST=pgvector
      - PG_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./Backend:/app
    depends_on:
      db:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flowly-network
    command: celery -A config worker -l info

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: flowly-celery-beat
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-False}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-secret-for-local-dev-only}
      - DB_NAME=${DB_NAME:-flowly}
      - DB_USER=${DB_USER:-flowly}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - DB_HOST=db
      - DB_PORT=3306
      - PG_NAME=${PG_NAME:-flowly_vector}
      - PG_USER=${PG_USER:-flowly}
      - PG_PASSWORD=${PG_PASSWORD:-flowly_vector_pass}
      - PG_HOST=pgvector
      - PG_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./Backend:/app
    depends_on:
      db:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flowly-network
    command: celery -A config beat -l info

  # Vue Frontend
  frontend:
    build:
      context: ./Frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: flowly-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=${API_URL:-http://backend:8000}
      - VITE_WS_URL=${WS_URL:-ws://backend:8000}
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - flowly-network

  # Nginx Reverse Proxy
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    container_name: flowly-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - flowly-network

networks:
  flowly-network:
    driver: bridge

volumes:
  pgvector_data:
  mysql_data:
  redis_data:
  static_volume:
  media_volume:
