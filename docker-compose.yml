# Flowly-now local app stack (reuse existing MySQL/Redis/pgvector on host).
# Usage:
#   docker compose -f docker-compose.yml up -d
# Infra expected on host:
#   MySQL 3307, Redis 6379, pgvector 5433

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: flowly-now-backend:latest
    container_name: flowly-now-backend
    working_dir: /app
    volumes:
      - ./Backend:/app
      - ./Frontend:/frontend:ro
      - ./_external:/external:ro
      - ./Backend/outputs:/app/outputs
      - flowly_now_media:/app/media
      - flowly_now_static:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: "3307"
      REDIS_HOST: host.docker.internal
      REDIS_PORT: "6379"
      REDIS_CACHE_URL: redis://host.docker.internal:6379/1
      CELERY_BROKER_URL: redis://host.docker.internal:6379/0
      CELERY_RESULT_BACKEND: redis://host.docker.internal:6379/0
      PG_HOST: host.docker.internal
      PG_PORT: "5433"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      ALLOWED_HOSTS: "*"
      CODEGRAPH_FRONTEND_PATH: /frontend/src
      CODEGRAPH_BACKEND_PATH: /app
      YOLO_CONFIG_DIR: /opt/ultralytics
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      daphne -b 0.0.0.0 -p 8000 config.asgi:application
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/api/v1/health/ || curl -sf http://127.0.0.1:8000/api/health/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  celery:
    image: flowly-now-backend:latest
    container_name: flowly-now-celery
    working_dir: /app
    volumes:
      - ./Backend:/app
      - ./Backend/outputs:/app/outputs
      - flowly_now_media:/app/media
    env_file:
      - ./Backend/.env
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: "3307"
      REDIS_HOST: host.docker.internal
      REDIS_PORT: "6379"
      REDIS_CACHE_URL: redis://host.docker.internal:6379/1
      CELERY_BROKER_URL: redis://host.docker.internal:6379/0
      CELERY_RESULT_BACKEND: redis://host.docker.internal:6379/0
      PG_HOST: host.docker.internal
      PG_PORT: "5433"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      C_FORCE_ROOT: "1"
      YOLO_CONFIG_DIR: /opt/ultralytics
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      celery -A config worker -l info -c 2 --pool=threads
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    image: flowly-now-frontend-fixed:latest
    container_name: flowly-now-frontend
    ports:
      - "5200:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  flowly_now_media:
  flowly_now_static:
