# Flowly API Specification
# Version: 1.0.0
# Base URL: /api/v1
# Authentication: Bearer Token (Token-based)

openapi: 3.0.3
info:
  title: Flowly AI Workflow Platform API
  description: |
    Flowly is an AI-powered workflow orchestration platform supporting:
    - Visual workflow editor with drag-and-drop nodes
    - AI Agent creation and management
    - Natural Language to Workflow generation
    - RAG (Retrieval Augmented Generation) knowledge base
    - Real-time monitoring and analytics
  version: 1.0.0
  contact:
    name: Flowly Support
    email: support@flowly.ai

servers:
  - url: /api/v1
    description: Current API version

security:
  - bearerAuth: []

# =============================================================================
# SHARED COMPONENTS
# =============================================================================

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ----- Common -----
    PaginatedResponse:
      type: object
      properties:
        count:
          type: integer
          description: Total number of results
        next:
          type: string
          nullable: true
          description: URL to next page
        previous:
          type: string
          nullable: true
          description: URL to previous page
        results:
          type: array
          items:
            type: object

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
        detail:
          type: string
          description: Detailed error information
        code:
          type: string
          description: Error code for programmatic handling

    UserSimple:
      type: object
      properties:
        id:
          type: integer
          description: User ID
        username:
          type: string
          description: Username
        email:
          type: string
          format: email
          description: Email address
        avatar:
          type: string
          format: uri
          nullable: true
          description: Avatar URL

    PaginationParams:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
          description: Page number
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: Results per page

  responses:
    BadRequest:
      description: Bad Request - Invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Validation error
            detail: name: This field is required.

    Unauthorized:
      description: Unauthorized - Invalid or missing token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Authentication credentials were not provided.

    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: You do not have permission to perform this action.

    NotFound:
      description: Not Found - Resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Not found.

    ServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Internal server error.

# =============================================================================
# AUTHENTICATION - /auth
# =============================================================================

paths:
  # ----- Authentication -----
  /auth/register/:
    post:
      tags: [Authentication]
      summary: Register new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
                - password_confirm
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 150
                  description: Unique username
                  example: john_doe
                email:
                  type: string
                  format: email
                  description: Email address
                  example: john@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: Password (min 8 chars)
                  example: SecurePass123!
                password_confirm:
                  type: string
                  format: password
                  description: Password confirmation
                  example: SecurePass123!
                first_name:
                  type: string
                  maxLength: 150
                  example: John
                last_name:
                  type: string
                  maxLength: 150
                  example: Doe
                phone:
                  type: string
                  maxLength: 20
                  example: "+86-138-0000-0000"
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  username:
                    type: string
                  email:
                    type: string
                  access:
                    type: string
                    description: JWT access token
                  refresh:
                    type: string
                    description: JWT refresh token
              example:
                id: 1
                username: john_doe
                email: john@example.com
                access: eyJhbGciOiJIUzI1NiIs...
                refresh: eyJhbGciOiJIUzI1NiIs...
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/login/:
    post:
      tags: [Authentication]
      summary: User login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: john_doe
                password:
                  type: string
                  format: password
                  example: SecurePass123!
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
                    description: JWT access token
                  refresh:
                    type: string
                    description: JWT refresh token
                  user:
                    $ref: '#/components/schemas/UserSimple'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh/:
    post:
      tags: [Authentication]
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh
              properties:
                refresh:
                  type: string
                  description: JWT refresh token
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
                  refresh:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me/:
    get:
      tags: [Authentication]
      summary: Get current user profile
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSimple'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password/:
    post:
      tags: [Authentication]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - old_password
                - new_password
                - new_password_confirm
              properties:
                old_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 8
                new_password_confirm:
                  type: string
                  format: password
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/forgot-password/:
    post:
      tags: [Authentication]
      summary: Request password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /auth/reset-password/:
    post:
      tags: [Authentication]
      summary: Reset password with token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - uidb64
                - token
                - new_password
              properties:
                uidb64:
                  type: string
                  description: User ID base64 encoded
                token:
                  type: string
                  description: Password reset token
                new_password:
                  type: string
                  format: password
      responses:
        '200':
          description: Password reset successful
        '400':
          $ref: '#/components/responses/BadRequest'

# =============================================================================
# WORKFLOWS - /workflows
# =============================================================================

  /workflows/:
    get:
      tags: [Workflows]
      summary: List workflows
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
          description: Search by name or description
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, paused, archived]
        - name: ordering
          in: query
          schema:
            type: string
            enum: [-created_at, created_at, -updated_at, updated_at, name, -name]
      responses:
        '200':
          description: List of workflows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/WorkflowList'
    post:
      tags: [Workflows]
      summary: Create workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowCreate'
      responses:
        '201':
          description: Workflow created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDetail'
        '400':
          $ref: '#/components/responses/BadRequest'

  /workflows/{id}/:
    get:
      tags: [Workflows]
      summary: Get workflow detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Workflow detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Workflows]
      summary: Update workflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowUpdate'
      responses:
        '200':
          description: Workflow updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDetail'
    delete:
      tags: [Workflows]
      summary: Delete workflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Workflow deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /workflows/{id}/execute/:
    post:
      tags: [Workflows]
      summary: Execute workflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input_data:
                  type: object
                  description: Workflow input parameters
                  example:
                    user_input: "Hello, world!"
                trigger_type:
                  type: string
                  default: manual
                  enum: [manual, webhook, scheduled, api]
                is_async:
                  type: boolean
                  default: false
                  description: Run asynchronously
      responses:
        '201':
          description: Execution started
          content:
            application/json:
              schema:
                type: object
                properties:
                  execution_id:
                    type: integer
                  status:
                    type: string
                  task_id:
                    type: string
                    nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /workflows/{id}/duplicate/:
    post:
      tags: [Workflows]
      summary: Duplicate workflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Workflow duplicated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDetail'

  /workflows/{id}/export/:
    get:
      tags: [Workflows]
      summary: Export workflow as JSON
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Workflow export data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDetail'

  /workflows/{id}/validate/:
    post:
      tags: [Workflows]
      summary: Validate workflow structure
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
                  warnings:
                    type: array
                    items:
                      type: string

  /workflows/{id}/stream_execute/:
    post:
      tags: [Workflows]
      summary: Execute workflow with streaming
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input_data:
                  type: object
      responses:
        '200':
          description: Streaming response (SSE)
          content:
            text/event-stream:
              schema:
                type: string

  /workflows/import/:
    post:
      tags: [Workflows]
      summary: Import workflow from JSON
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowCreate'
      responses:
        '201':
          description: Workflow imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDetail'

  # ----- Nodes -----
  /workflows/nodes/:
    get:
      tags: [Workflows]
      summary: List nodes
      parameters:
        - name: workflow
          in: query
          required: true
          schema:
            type: integer
          description: Workflow ID
      responses:
        '200':
          description: List of nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Node'
    post:
      tags: [Workflows]
      summary: Create node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeCreate'
      responses:
        '201':
          description: Node created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'

  /workflows/nodes/{id}/:
    get:
      tags: [Workflows]
      summary: Get node detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Node detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
    patch:
      tags: [Workflows]
      summary: Update node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeCreate'
      responses:
        '200':
          description: Node updated
    delete:
      tags: [Workflows]
      summary: Delete node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Node deleted

  /workflows/nodes/available_types/:
    get:
      tags: [Workflows]
      summary: Get available node types
      responses:
        '200':
          description: Available node types
          content:
            application/json:
              schema:
                type: object
                properties:
                  node_types:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          example: llm
                        label:
                          type: string
                          example: LLM
                        category:
                          type: string
                          example: AI
                        description:
                          type: string

  /workflows/nodes/batch_update_positions/:
    post:
      tags: [Workflows]
      summary: Batch update node positions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                positions:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                      position:
                        type: object
                        properties:
                          x:
                            type: number
                          y:
                            type: number
      responses:
        '200':
          description: Positions updated

  # ----- Edges -----
  /workflows/edges/:
    get:
      tags: [Workflows]
      summary: List edges
      parameters:
        - name: workflow
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of edges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Edge'
    post:
      tags: [Workflows]
      summary: Create edge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EdgeCreate'
      responses:
        '201':
          description: Edge created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Edge'

  /workflows/edges/{id}/:
    patch:
      tags: [Workflows]
      summary: Update edge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EdgeCreate'
      responses:
        '200':
          description: Edge updated
    delete:
      tags: [Workflows]
      summary: Delete edge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Edge deleted

  # ----- Executions -----
  /workflows/executions/:
    get:
      tags: [Workflows]
      summary: List executions
      parameters:
        - name: workflow
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
        - name: page_size
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of executions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/Execution'

  /workflows/executions/{id}/:
    get:
      tags: [Workflows]
      summary: Get execution detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Execution detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionDetail'

  /workflows/executions/{id}/cancel/:
    post:
      tags: [Workflows]
      summary: Cancel execution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Execution cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: cancelled

  /workflows/executions/{id}/logs/:
    get:
      tags: [Workflows]
      summary: Get execution logs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Execution logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  node_status:
                    type: object
                  error_message:
                    type: string
                    nullable: true
                  traceback:
                    type: string
                    nullable: true

# =============================================================================
# AGENTS - /agents
# =============================================================================

  /agents/:
    get:
      tags: [Agents]
      summary: List agents
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: page_size
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of agents
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/AgentList'
    post:
      tags: [Agents]
      summary: Create agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreate'
      responses:
        '201':
          description: Agent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetail'

  /agents/{id}/:
    get:
      tags: [Agents]
      summary: Get agent detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Agent detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetail'
    patch:
      tags: [Agents]
      summary: Update agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentUpdate'
      responses:
        '200':
          description: Agent updated
    delete:
      tags: [Agents]
      summary: Delete agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Agent deleted

  /agents/{id}/chat/:
    post:
      tags: [Agents]
      summary: Chat with agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  description: User message
                  example: "Hello, how are you?"
                conversation_id:
                  type: integer
                  nullable: true
                  description: Continue existing conversation
      responses:
        '200':
          description: Chat response
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation_id:
                    type: integer
                  response:
                    type: string
                    description: Agent response
                  tool_calls:
                    type: array
                    items:
                      type: object
                    nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'

  /agents/{id}/stream_chat/:
    post:
      tags: [Agents]
      summary: Chat with agent (streaming)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                conversation_id:
                  type: integer
                  nullable: true
      responses:
        '200':
          description: Streaming response (SSE)
          content:
            text/event-stream:
              schema:
                type: string

  /agents/{id}/debug/:
    post:
      tags: [Agents]
      summary: Debug agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
      responses:
        '200':
          description: Debug response
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                  tool_calls:
                    type: array
