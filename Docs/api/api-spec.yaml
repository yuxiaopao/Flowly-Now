# =============================================================================
# SHARED DATA SCHEMAS
# =============================================================================

schemas:
  # ----- User -----
  UserSimple:
    type: object
    properties:
      id:
        type: integer
        example: 1
      username:
        type: string
        example: john_doe
      email:
        type: string
        format: email
        example: john@example.com
      avatar:
        type: string
        format: uri
        nullable: true
        example: https://example.com/avatar.jpg

  # ----- Workflow -----
  WorkflowList:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string
      description:
        type: string
      owner:
        $ref: '#/components/schemas/UserSimple'
      status:
        type: string
        enum: [draft, active, paused, archived]
      status_display:
        type: string
      is_published:
        type: boolean
      is_public:
        type: boolean
      version:
        type: integer
      tags:
        type: array
        items:
          type: string
      node_count:
        type: integer
      execution_count:
        type: integer
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time

  WorkflowDetail:
    allOf:
      - $ref: '#/components/schemas/WorkflowList'
      - type: object
        properties:
          settings:
            type: object
          parent:
            type: integer
            nullable: true
          nodes:
            type: array
            items:
              $ref: '#/components/schemas/Node'
          edges:
            type: array
            items:
              $ref: '#/components/schemas/Edge'

  WorkflowCreate:
    type: object
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 200
        example: My Workflow
      description:
        type: string
        example: A workflow for processing data
      status:
        type: string
        enum: [draft, active, paused]
        default: draft
      is_published:
        type: boolean
        default: false
      is_public:
        type: boolean
        default: false
      tags:
        type: array
        items:
          type: string
        example: ["ai", "automation"]
      settings:
        type: object
      nodes:
        type: array
        items:
          $ref: '#/components/schemas/NodeCreate'
      edges:
        type: array
        items:
          $ref: '#/components/schemas/EdgeCreate'

  WorkflowUpdate:
    type: object
    properties:
      name:
        type: string
      description:
        type: string
      status:
        type: string
        enum: [draft, active, paused, archived]
      is_published:
        type: boolean
      is_public:
        type: boolean
      tags:
        type: array
        items:
          type: string
      settings:
        type: object

  # ----- Node -----
  Node:
    type: object
    properties:
      id:
        type: integer
      workflow:
        type: integer
      node_type:
        type: string
        example: llm
      node_type_display:
        type: string
        example: LLM
      name:
        type: string
      description:
        type: string
      position_x:
        type: integer
      position_y:
        type: integer
      config:
        type: object
        description: Node-specific configuration
      style:
        type: object
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time

  NodeCreate:
    type: object
    properties:
      node_type:
        type: string
        example: llm
      name:
        type: string
        example: LLM Node
      description:
        type: string
      position_x:
        type: integer
        example: 100
      position_y:
        type: integer
        example: 200
      config:
        type: object
        example:
          model: gpt-4
          temperature: 0.7
          system_prompt: You are a helpful assistant.
      style:
        type: object

  # ----- Edge -----
  Edge:
    type: object
    properties:
      id:
        type: integer
      workflow:
        type: integer
      source_node:
        type: integer
      source_node_name:
        type: string
      target_node:
        type: integer
      target_node_name:
        type: string
      label:
        type: string
      type:
        type: string
        default: default
      animated:
        type: boolean
        default: false
      condition:
        type: object

  EdgeCreate:
    type: object
    properties:
      source_node:
        type: integer
        description: Source node ID
        example: 1
      target_node:
        type: integer
        description: Target node ID
        example: 2
      label:
        type: string
      type:
        type: string
      animated:
        type: boolean
      condition:
        type: object

  # ----- Execution -----
  Execution:
    type: object
    properties:
      id:
        type: integer
      workflow:
        type: integer
      workflow_name:
        type: string
      status:
        type: string
        enum: [pending, running, completed, failed, cancelled]
      status_display:
        type: string
      trigger_type:
        type: string
      started_at:
        type: string
        format: date-time
      completed_at:
        type: string
        format: date-time
        nullable: true
      duration:
        type: number
        nullable: true

  ExecutionDetail:
    allOf:
      - $ref: '#/components/schemas/Execution'
      - type: object
        properties:
          input_data:
            type: object
          output_data:
            type: object
          error_message:
            type: string
            nullable: true
          node_status:
            type: object

  # ----- Agent -----
  AgentList:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string
      description:
        type: string
      agent_type:
        type: string
        enum: [conversational, task, research, coding]
      model:
        type: string
        example: gpt-4
      is_active:
        type: boolean
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time

  AgentDetail:
    allOf:
      - $ref: '#/components/schemas/AgentList'
      - type: object
        properties:
          system_prompt:
            type: string
          temperature:
            type: number
          max_tokens:
            type: integer
          tools:
            type: array
            items:
              type: string
          skills:
            type: array
            items:
              type: string
          memory_enabled:
            type: boolean
          context_window:
            type: integer
          settings:
            type: object
          tools_detail:
            type: array
            items:
              $ref: '#/components/schemas/AgentTool'

  AgentCreate:
    type: object
    required:
      - name
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 200
      description:
        type: string
      agent_type:
        type: string
        enum: [conversational, task, research, coding]
        default: conversational
      system_prompt:
        type: string
      model:
        type: string
        default: gpt-4
      temperature:
        type: number
        minimum: 0
        maximum: 2
        default: 0.7
      max_tokens:
        type: integer
        default: 2000
      tools:
        type: array
        items:
          type: string
        example: ["search", "calculator"]
      skills:
        type: array
        items:
          type: string
      memory_enabled:
        type: boolean
        default: true
      context_window:
        type: integer
        default: 10
      is_active:
        type: boolean
        default: true

  AgentUpdate:
    type: object
    properties:
      name:
        type: string
      description:
        type: string
      system_prompt:
        type: string
      model:
        type: string
      temperature:
        type: number
      max_tokens:
        type: integer
      tools:
        type: array
        items:
          type: string
      skills:
        type: array
        items:
          type: string
      memory_enabled:
        type: boolean
      context_window:
        type: integer
      is_active:
        type: boolean

  AgentTool:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string
      tool_type:
        type: string
      config:
        type: object
      is_enabled:
        type: boolean

  AgentConversation:
    type: object
    properties:
      id:
        type: integer
      agent:
        type: integer
      messages:
        type: array
        items:
          type: object
          properties:
            role:
              type: string
              enum: [user, assistant, system]
            content:
              type: string
      summary:
        type: string
      message_count:
        type: integer
      token_count:
        type: integer
      created_at:
        type: string
        format: date-time
      updated_at:
