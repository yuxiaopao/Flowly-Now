[pytest]
DJANGO_SETTINGS_MODULE = config.project_test_settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
pythonpath = Backend .
testpaths = tests/backend tests/nl_workflow Backend/workflows/tests Backend/core/tests Backend/website_generator/tests Backend/nl_to_workflow/tests Backend/tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
