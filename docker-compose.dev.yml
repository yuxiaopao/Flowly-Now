# Local development infrastructure (optional).
# Usage: docker compose -f docker-compose.dev.yml up -d qdrant
services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: flowly-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
